# The release: change image.tag here and merge; dev clusters get it. scripts/promote.sh then moves it to
# prod (only if dev is healthy on it), one prod cluster at a time.
image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: 6.7.0
replicaCount: 2
resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { memory: 64Mi }
