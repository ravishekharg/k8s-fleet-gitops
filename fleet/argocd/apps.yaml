# Team app on every managed cluster. Two mechanisms, one per job:
#   - between environments: git. Dev clusters follow `main`; prod clusters follow the `prod`
#     branch, which only scripts/promote.sh moves, and only to a commit that has been Synced and
#     Healthy on every dev cluster for a soak period. A release that doesn't come up on dev is
#     never promoted.
#   - within prod: ApplicationSet progressive sync (RollingSync, maxUpdate: 1) updates one prod
#     cluster at a time and waits for it to be Healthy before the next.
# RollingSync alone can't order dev before prod reliably: it decides from each app's last seen
# state, so prod can be synced first if Argo CD notices the new commit there before it does on
# dev (argoproj/argo-cd#22852). docs/design.md has the details.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: podinfo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels: { fleet/managed: "true" }
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions: [{ key: env, operator: In, values: [dev] }]
        - matchExpressions: [{ key: env, operator: In, values: [prod] }]
          maxUpdate: 1
  template:
    metadata:
      name: 'podinfo-{{ .name }}'
      labels: { layer: apps, env: '{{ index .metadata.labels "env" }}' }
    spec:
      project: apps
      sources:
        - repoURL: https://stefanprodan.github.io/podinfo
          chart: podinfo
          targetRevision: 6.7.1
          helm:
            releaseName: podinfo
            valueFiles: ['$fleet/fleet/apps/podinfo/values.yaml', '$fleet/fleet/apps/podinfo/values-{{ index .metadata.labels "env" }}.yaml']
            ignoreMissingValueFiles: true
            parameters:
              - { name: ui.message, value: 'podinfo on {{ .name }} ({{ index .metadata.labels "region" }})' }
        - repoURL: http://fleet-git:3000/fleet/fleet.git
          targetRevision: '{{ if eq (index .metadata.labels "env") "prod" }}prod{{ else }}main{{ end }}'
          ref: fleet
      destination: { server: '{{ .server }}', namespace: podinfo }
      syncPolicy:
        syncOptions: [CreateNamespace=true]
        retry: { limit: 3, backoff: { duration: 10s, factor: 2, maxDuration: 1m } }
