# Static checks on every push; then the whole fleet (hub + 3 spokes + Git server, in kind) and
# the live fleet test: bootstrap, governance, drift, onboarding, rollout waves, halt on a bad release.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: render, validate, policy unit tests
        run: bash scripts/static-checks.sh

  fleet:
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: more inotify instances (four kind clusters on one runner)
        run: sudo sysctl -w fs.inotify.max_user_instances=512 fs.inotify.max_user_watches=524288
      - name: hub, spokes, git server, Argo CD
        run: bash scripts/up.sh
      - name: fleet test
        run: bash scripts/fleet-test.sh
      - name: state on failure
        if: failure()
        run: |
          export KUBECONFIG=/tmp/kubeconfig-fleet
          kubectl --context kind-fleet-hub -n argocd get applications -o wide || true
          kubectl --context kind-fleet-hub -n argocd logs deploy/argocd-applicationset-controller --tail=100 || true
