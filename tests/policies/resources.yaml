# Pods the fleet policies must accept (good) and reject (bad-*).
apiVersion: v1
kind: Pod
metadata: { name: good, namespace: podinfo }
spec:
  containers:
    - name: app
      image: ghcr.io/stefanprodan/podinfo:6.7.1
      resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } }
---
apiVersion: v1
kind: Pod
metadata: { name: bad-latest, namespace: podinfo }
spec:
  containers:
    - name: app
      image: nginx:latest
      resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } }
---
apiVersion: v1
kind: Pod
metadata: { name: bad-untagged, namespace: podinfo }
spec:
  containers:
    - name: app
      image: nginx
      resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } }
---
apiVersion: v1
kind: Pod
metadata: { name: bad-privileged, namespace: podinfo }
spec:
  containers:
    - name: app
      image: nginx:1.27
      securityContext: { privileged: true }
      resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } }
---
apiVersion: v1
kind: Pod
metadata: { name: bad-no-limits, namespace: podinfo }
spec:
  containers:
    - name: app
      image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata: { name: bad-hostpath, namespace: podinfo }
spec:
  containers:
    - name: app
      image: nginx:1.27
      resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } }
  volumes:
    - name: host
      hostPath: { path: /etc }
---
apiVersion: v1
kind: Pod
metadata: { name: system-exempt, namespace: kube-system }
spec:
  containers:
    - name: app
      image: nginx:latest
