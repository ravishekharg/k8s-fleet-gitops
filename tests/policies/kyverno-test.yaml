apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: fleet-policies
policies: [policies.yaml]
resources: [resources.yaml]
results:
  - { policy: disallow-latest-tag, rule: pinned-tag, resources: [good, bad-latest, bad-privileged, bad-no-limits, bad-hostpath], kind: Pod, result: pass }
  - { policy: disallow-latest-tag, rule: pinned-tag, resources: [bad-untagged], kind: Pod, result: fail }
  - { policy: disallow-latest-tag, rule: not-latest, resources: [bad-latest], kind: Pod, result: fail }
  - { policy: disallow-latest-tag, rule: not-latest, resources: [good, bad-untagged], kind: Pod, result: pass }
  - { policy: disallow-privileged, rule: no-privileged, resources: [bad-privileged], kind: Pod, result: fail }
  - { policy: disallow-privileged, rule: no-privileged, resources: [good], kind: Pod, result: pass }
  - { policy: require-requests-limits, rule: requests-and-memory-limit, resources: [bad-no-limits], kind: Pod, result: fail }
  - { policy: require-requests-limits, rule: requests-and-memory-limit, resources: [good], kind: Pod, result: pass }
  - { policy: disallow-host-path, rule: no-host-path, resources: [bad-hostpath], kind: Pod, result: fail }
  - { policy: disallow-host-path, rule: no-host-path, resources: [good], kind: Pod, result: pass }
  - { policy: disallow-latest-tag, rule: not-latest, resources: [system-exempt], kind: Pod, result: skip }
